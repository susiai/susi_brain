  /api/v1/compute/monitoring/active:
    get:
      tags:
      - Monitoring
      summary: Active
      description: Read ongoing server-side HTTP API requests, including waiting-for-headers
        and full SSE/WAV/cleanup lifetimes. Covers /api and /v1 namespaces, unknown
        API routes, documentation/assets, validation errors and CORS preflights; non-API
        pages and pre-ASGI failures are excluded. Arrival id is scoped by each row's
        instance_id; request_id is the possibly reused correlation header, nullable
        for early CORS. Paths are redacted route templates. No body, query string,
        credentials, client address or actual document path is stored. Chat and TTS
        rows include selected group/model/endpoint ID; speech uses model_group speech.
        Input text and generated audio are never stored. Active rows and totals reset
        on restart; process_started_at identifies this process's beginning. The request
        log and reconstructed histogram survive restarts with the same log directory.
        log_status exposes unflushed rows, 60-second flush interval, last successful
        nonempty flush, append_failed or null, and invalid archive rows skipped at
        startup. totals includes all traffic even when rows are filtered. This GET
        itself is active unless excluded. active_count may exceed limit; truncated
        reports omissions. No inference or probes are triggered.
      operationId: compute__active_requests
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Maximum active rows, oldest started first.
          default: 100
          title: Limit
        description: Maximum active rows, oldest started first.
      - name: exclude_monitoring
        in: query
        required: false
        schema:
          type: boolean
          description: Hide requests to these monitoring APIs from the rows and active_count.
          default: false
          title: Exclude Monitoring
        description: Hide requests to these monitoring APIs from the rows and active_count.
      - name: X-Request-ID
        in: header
        required: false
        description: Safe ASCII correlation ID; missing or invalid values are replaced
