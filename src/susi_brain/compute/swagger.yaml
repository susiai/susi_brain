  /api/v1/compute/monitoring/histogram:
    get:
      tags:
      - Monitoring
      summary: Histogram
      description: 'Read zero-filled UTC completion buckets, oldest first, including
        the current partial bucket. requests counts all finished outcomes; errors
        counts failed HTTP/application/transport requests; cancelled counts cancellation/disconnection.
        Errors and cancelled are disjoint subsets. Startup reconstructs aggregates
        from valid daily-log records before serving requests, including older entries
        outside the RAM cache. Each resolution keeps at most 1440 buckets: one day
        of minutes, ten days of ten-minute buckets, sixty days of hours and 1440 days
        of days. Rebuilding streams archive files without retaining their entire contents.
        observed_since is the earliest restored request start, or this process''s
        start without history; observed=false and partial=true identify time before
        this boundary/current bucket, not continuous server uptime. Active counters
        reset on restart; historical aggregates persist through the shared archive
        and no workers share active state. Requests still active enter a histogram
        only on completion. This GET is counted after returning; exclude_monitoring
        filters the view without disabling recording.'
      operationId: compute__request_histogram
      parameters:
      - name: interval
        in: query
        required: false
        schema:
          enum:
          - minute
          - ten_minutes
          - hour
          - day
          type: string
          description: UTC-aligned buckets of 60, 600, 3600 or 86400 seconds.
          default: minute
          title: Interval
        description: UTC-aligned buckets of 60, 600, 3600 or 86400 seconds.
      - name: buckets
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 1440
            minimum: 1
          - type: 'null'
          description: Bucket count; omitted defaults to 60 minutes, 144 ten-minute
            buckets, 168 hours or 30 days.
          title: Buckets
        description: Bucket count; omitted defaults to 60 minutes, 144 ten-minute
          buckets, 168 hours or 30 days.
      - name: exclude_monitoring
        in: query
        required: false
        schema:
          type: boolean
          description: Subtract monitoring API traffic from each bucket and totals.
          default: false
          title: Exclude Monitoring
        description: Subtract monitoring API traffic from each bucket and totals.
      - name: X-Request-ID
        in: header
        required: false
        description: Safe ASCII correlation ID; missing or invalid values are replaced
          by a UUID. This is not an inference or idempotency ID.
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
      responses:
        '200':
          description: Request monitoring snapshot with durable daily-log metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - instance_id
                - storage
                - process_started_at
                - cached_requests
                - log_status
                - observed_since
                - generated_at
                - log_capacity
                - retained_requests
                - evicted_requests
                - exclude_monitoring
                - interval
                - bucket_seconds
                - retention_buckets
                - totals
                - buckets
                properties:
                  instance_id:
                    type: string
                  storage:
                    type: string
                    enum:
                    - daily-jsonl
                    - process-local
                  process_started_at:
                    type: string
                  cached_requests:
                    type: integer
                    minimum: 0
                  log_status:
                    type: object
                    required:
                    - buffered_entries
                    - flush_interval_seconds
                    - last_flush_at
                    - error
                    - ignored_lines
                    properties:
                      buffered_entries:
                        type: integer
                        minimum: 0
                      flush_interval_seconds:
                        type: number
                        exclusiveMinimum: 0
                      last_flush_at:
                        type:
                        - string
                        - 'null'
                      error:
                        type:
                        - string
                        - 'null'
                        enum:
                        - append_failed
                        - null
                      ignored_lines:
                        type: integer
                        minimum: 0
                  observed_since:
                    type: string
                  generated_at:
                    type: string
                  log_capacity:
                    type: integer
                    minimum: 0
                  retained_requests:
                    type: integer
                    minimum: 0
                  evicted_requests:
                    type: integer
                    minimum: 0
                  exclude_monitoring:
                    type: boolean
                  interval:
                    type: string
                    enum:
                    - minute
                    - ten_minutes
                    - hour
                    - day
                  bucket_seconds:
                    type: integer
                    enum:
                    - 60
                    - 600
                    - 3600
                    - 86400
                  retention_buckets:
                    type: integer
                    const: 1440
                  totals:
                    type: object
                    properties:
                      requests:
                        type: integer
                        minimum: 0
                      errors:
                        type: integer
                        minimum: 0
                      cancelled:
                        type: integer
                        minimum: 0
                    required:
                    - requests
                    - errors
                    - cancelled
                  buckets:
                    type: array
                    items:
                      type: object
                      required:
                      - start
                      - end
                      - requests
                      - errors
                      - cancelled
                      - observed
                      - partial
                      properties:
                        start:
                          type: string
                        end:
                          type: string
                        requests:
                          type: integer
                          minimum: 0
                        errors:
                          type: integer
                          minimum: 0
                        cancelled:
                          type: integer
                          minimum: 0
                        observed:
                          type: boolean
                        partial:
                          type: boolean
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '405':
          description: Method Not Allowed
          content:
