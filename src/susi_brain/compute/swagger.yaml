                        type: string
                      param:
                        type:
                        - string
                        - 'null'
                      code:
                        type: string
                    type: object
                type: object
        '504':
          description: Upstream operation or first-audio timeout before response headers.
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      message:
                        type: string
                      type:
                        type: string
                      param:
                        type:
                        - string
                        - 'null'
                      code:
                        type: string
                    type: object
                type: object
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        description: Safe ASCII correlation ID; missing or invalid values are replaced
          by a UUID. This is not an inference or idempotency ID.
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
  /api/v1/compute/chat/connections:
    get:
      tags:
      - Services
      summary: Connections
      description: Read shared Chat/TTS reservations per endpoint and concrete model
        without upstream calls. Counts include connecting/waiting requests, JSON responses,
        SSE/WAV upstream lifetimes and calibration checks. Chat releases on [DONE]
        without waiting for upstream EOF or client draining; otherwise cleanup releases
        on completion, error, timeout, cancellation or disconnect. WAV releases after
        streaming cleanup. Discovery, idle pooled sockets and ordinary metadata reads
        are excluded. Selection/reservation is atomic after discovery. Calibration
        checks reserve for the whole check, including sequential forms calls or availability
        metadata. Chat and speech selection share endpoint load. Empty endpoints have
        zero and an empty models dictionary. Counters are process-local, start at
        zero and are not shared between workers. IDs match calibration endpoint IDs;
