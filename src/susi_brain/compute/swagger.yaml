  /api/v1/compute/chat/completions:
    post:
      tags:
      - Services
      summary: Generate a chat completion
      description: Generate a chat completion. Forwards messages, model, temperature
        and max_tokens to OpenAI. Omitted options default to model gpt-3.5-turbo,
        temperature 1.0 and max_tokens 50; other request options are ignored. Uses
        the configured OpenAI key. Missing data, messages or key return an error dictionary
        with HTTP 200. Returns the provider JSON, including provider errors, with
        HTTP 200.
      operationId: compute__chat_0
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
                type: object
              - type: 'null'
              properties:
                messages:
                  items:
                    type: object
                  type: array
                model:
                  type: string
                  default: gpt-3.5-turbo
                temperature:
                  type: number
                  default: 1.0
                max_tokens:
                  type: integer
                  default: 50
              type: object
              required:
              - messages
              title: Data
            example:
              messages:
              - role: user
                content: Hello
        required: false
      responses:
        '200':
          description: Service response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '404':
