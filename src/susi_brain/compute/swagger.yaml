  /api/v1/compute/calibration:
    get:
      summary: Results
      description: Read progress and endpoint/model capability/latency snapshots without
        triggering work. model_groups exposes smart/small names and rankings; speech_models
        lists explicitly configured speech names/default voices even before calibration.
        Each record has task chat or speech. Speech records expose Ollama voices and
        the proxy's WAV format/sample rate in speech, the measured voice, capability
        speech, and availability/speech/speed checks; chat-only capabilities remain
        null. These audio probes validate nonempty aligned 24 kHz mono 16-bit PCM
        WAV, not pronunciation, intelligibility or language quality. Speech metrics
        use ttfa_seconds from before the POST until the first complete PCM frame (WAV
        header alone does not count), audio_duration_seconds from actual PCM length,
        and real_time_factor=full request duration/audio duration; lower is faster.
        Timing includes transport/server load and only applies to the measured voice.
        Results are process-local, replaced by each run and cleared on restart. Credentials,
        prompts and generated audio/text are omitted. Null capabilities mean untested,
        skipped or inconclusive; false means a fixed probe did not demonstrate support.
        Chat forms validates three mood classifications; vision reads 42; thinking
        detects exposed reasoning. Chat TTFT starts before the speed POST and ends
        at the first nonempty content/reasoning delta. tokens_per_second=reported
        completion_tokens/full stream duration including TTFT. generation_tokens_per_second=(completion_tokens-1)/(last-output-time-first-output-time),
        null for unknown counts, one output event or hidden reasoning. Transport chunks
        are never token counts. run completed means probes finished; inspect individual
        checks for failures.
