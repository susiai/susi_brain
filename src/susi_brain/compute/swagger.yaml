openapi: 3.1.0
info:
  title: SUSI Compute
  description: 'Step 1 connects the unchanged Flask chat, audio and file/search services
    to the new server. Original HTTP routes and native aliases invoke the same handlers,
    with their original behavior and limitations. Readiness describes application
    resources; local models load on their first request. Anonymous local profile;
    default bind address 127.0.0.1, port 8042. Authenticated configuration is not
    supported in this step. Native operational failures use application/problem+json
    with a safe X-Request-ID; native 429 and 503 responses include Retry-After: 1.
    Flask service responses are passed through unchanged. Chat requires an OpenAI
    key; file mutations require a SUSI Bearer token. Missing or invalid supplied credentials
    never fall back to anonymous access.'
  version: 0.1.0
servers:
- url: /
paths:
  /api/v1/compute/health/live:
    get:
      summary: Live
      description: The HTTP process is alive; application resources may still be unavailable.
      operationId: compute__health_live
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Compute  Health Live
              example:
                status: ok
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        description: Safe ASCII correlation ID; missing or invalid values are replaced
          by a UUID. This is not an inference or idempotency ID.
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
