            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Compute  Status
              example:
                service: compute
                stage: migration-step-1
                ready: true
                authentication: disabled
                protocol_version: '1'
                implemented:
                - health
                - status
                - capabilities
                - offline-docs
                - chat
                - audio-transcription
                - file-storage
                - search
                - system-metrics
                pending:
                - resident-model-lifecycle
                - provider-selection
                - decision-interface
                - resource-admission-control
                - embedding
                - speech
                dependencies: []
