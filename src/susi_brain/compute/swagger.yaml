          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '500':
          description: Original service failure or adapter failure
          content:
            application/json:
              schema:
                type: object
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '400':
          description: Original invalid input response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '403':
          description: The server boundary rejects traversal and symlinks
          content:
            application/json:
              schema:
                type: object
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '415':
          description: A JSON body requires application/json
          content:
            application/json:
              schema:
                type: object
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  default: tiny
                  description: tiny, base, small, medium, large, whisper-1, en-us
                    or de; other names return an empty dictionary when a key is set.
      parameters:
      - name: Authorization
