  /api/v1/compute/monitoring/requests:
    get:
      tags:
      - Monitoring
      summary: Requests
      description: Search completed requests, newest completion_id first, across daily
        JSONL files and not-yet-flushed RAM rows. Each call to the shared BufferedDailyLog.log
        queues one row; its worker appends every 60 seconds using O_APPEND, without
        rewriting existing content. Only requests-YYYY-MM-DD.jsonl for the UTC day
        at flush time is appended; a batch crossing midnight belongs to the new day
        while event timestamps remain unchanged. Default request_log_directory is
        logs/compute, outside the public document directory. Shutdown drains the remainder;
        a crash can lose unflushed RAM rows. There is no automatic archive deletion.
        request_log_capacity (default 10000, 1..100000) bounds only the recent cache;
        retained_requests includes disk and buffered records, cached_requests reports
        the cache and evicted_requests is zero for durable storage. log_status reports
        flush health. One writer may own each directory; another writer fails startup.
        Completion IDs resume after the highest valid archived ID and remain stable
        for pagination across restarts; arrival id is scoped by the row's original
        instance_id. Search uses AND-combined exact filters, literal q and timezone-aware
        since inclusive/until exclusive; an invalid time range returns 422. next_before=null
        means no older matching rows. Disk searches run in a worker thread. Corrupt,
        oversized or incompatible rows are skipped at startup/search. History contains
        safe metadata only; no scopes, bodies, queries, credentials or raw exception
        text. Failed/cancelled/disconnected outcomes remain distinct. This GET is
        logged after its response completes; no provider calls or automatic generation
        retries occur.
      operationId: compute__request_log
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Maximum completed log rows.
          default: 100
          title: Limit
        description: Maximum completed log rows.
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Exclusive completion_id cursor from next_before; persisted
            IDs remain valid after restart in the same log directory.
          title: Before
        description: Exclusive completion_id cursor from next_before; persisted IDs
          remain valid after restart in the same log directory.
      - name: exclude_monitoring
        in: query
        required: false
        schema:
          type: boolean
          description: Hide monitoring API requests; recording still includes them.
          default: false
          title: Exclude Monitoring
        description: Hide monitoring API requests; recording still includes them.
      - name: method
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 16
            pattern: ^[A-Z]+$
          - type: 'null'
          description: Exact uppercase HTTP method filter.
          title: Method
        description: Exact uppercase HTTP method filter.
      - name: status_code
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 599
            minimum: 100
          - type: 'null'
          description: Exact HTTP status filter.
          title: Status Code
        description: Exact HTTP status filter.
      - name: path
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
          description: Exact API route template filter, not a concrete document path.
          title: Path
        description: Exact API route template filter, not a concrete document path.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          description: Case-insensitive literal substring of JSON request metadata;
            no regex or shell.
          title: Q
        description: Case-insensitive literal substring of JSON request metadata;
          no regex or shell.
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive log timestamp, ISO 8601 with timezone, for example
            2026-10-25T00:00:00Z.
          title: Since
        description: Inclusive log timestamp, ISO 8601 with timezone, for example
          2026-10-25T00:00:00Z.
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Exclusive log timestamp, ISO 8601 with timezone; must not precede
            since.
          title: Until
        description: Exclusive log timestamp, ISO 8601 with timezone; must not precede
          since.
      - name: X-Request-ID
        in: header
        required: false
        description: Safe ASCII correlation ID; missing or invalid values are replaced
          by a UUID. This is not an inference or idempotency ID.
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
      responses:
        '200':
          description: Request monitoring snapshot with durable daily-log metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - instance_id
                - storage
                - process_started_at
                - cached_requests
                - log_status
                - observed_since
                - generated_at
                - log_capacity
                - retained_requests
                - evicted_requests
                - exclude_monitoring
                - requests
                - next_before
                properties:
                  instance_id:
                    type: string
                  storage:
                    type: string
                    enum:
                    - daily-jsonl
                    - process-local
                  process_started_at:
                    type: string
                  cached_requests:
                    type: integer
                    minimum: 0
                  log_status:
                    type: object
                    required:
                    - buffered_entries
                    - flush_interval_seconds
                    - last_flush_at
                    - error
                    - ignored_lines
                    properties:
                      buffered_entries:
                        type: integer
                        minimum: 0
                      flush_interval_seconds:
                        type: number
                        exclusiveMinimum: 0
                      last_flush_at:
                        type:
                        - string
                        - 'null'
                      error:
                        type:
                        - string
                        - 'null'
                        enum:
                        - append_failed
                        - null
                      ignored_lines:
                        type: integer
                        minimum: 0
