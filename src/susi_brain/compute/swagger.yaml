  /v1/chat/completions:
    post:
      tags:
      - Services
      summary: Proxy a chat completion using model smart or small
      description: 'Proxy a chat completion using model smart or small. Both model
        and nonempty messages are required. Queries each configured API base URL plus
        /models concurrently for every valid request. Legacy host:port targets use
        http://host:port/v1; URL objects preserve HTTP(S) and API prefixes such as
        https://openrouter.ai/api/v1. Each object may set api_key or api_key_env for
        its own Bearer credential, used for both discovery and chat. A missing/empty
        referenced key is a startup configuration error. Reserves the matching endpoint
        with the fewest active requests, counting all models, Chat JSON/SSE, TTS WAV
        and calibration checks. On each endpoint, reuses an active model in the requested
        group when one is available; otherwise another model may be used. Among endpoints
        with equal load, smart selects the highest operator-configured numeric ranking,
        then the fastest model; small selects the fastest model regardless of ranking.
        Group configuration accepts model-name strings (ranking 0) or objects with
        name and finite numeric ranking (default 0). Speed uses calibration tokens_per_second
        descending, then ttft_seconds ascending; missing measurements sort last for
        each metric. Remaining ties use model-list then endpoint order. There is no
        waiting queue or hard single-model lock. Selection and reservation are atomic
        within this process; counters are not shared across workers. GET /api/v1/compute/chat/connections
        exposes live counts. Model discovery compares names case-insensitively and
        forwards the advertised spelling. Only model is rewritten; all other request
        JSON fields pass through with backend defaults. Streaming follows triton_llmlb:
        the first data line (when it contains a JSON object) and the first terminal
        completion object receive four top-level fields: modelname (the concrete selected
        model), compute_group (smart/small), compute_hostname (selected API base''s
        hostname, without port/path) and request_bytes (original incoming UTF-8 HTTP
        body length, before model rewriting; no headers). These proxy-owned values
        override same-named upstream fields on those two objects; the standard model
        field is preserved. Byte lines are assembled across network chunks; only the
        first data payload and byte-prefiltered terminal candidates are parsed. A
        terminal candidate contains a string-valued finish_reason, then must have
        a non-null finish_reason in a choice. The first event may itself be terminal
        and is then annotated once. Annotation reserializes the JSON as UTF-8 data:
        ... with LF/LF framing. Middle lines, content/thinking/tool deltas, usage-only
        events, invalid/non-object JSON and ordinary SSE framing pass unchanged; multiline
        JSON data is not combined for annotation. Like the reference, an invalid first
        data line consumes the first-line attempt. No usage request, token counts,
        finish reason or missing completion is synthesized. Receiving [DONE], even
        without a final newline, closes upstream and releases its reservation immediately;
        already received trailing blank framing is preserved without waiting for EOF.
        HTTPX handles upstream content encoding; HTTP chunk boundaries can change.
        Streams disable caches/proxy buffering and request no-transform. Forwarded
        JSON and SSE responses add X-Compute-Target: an ASCII JSON object containing
        endpoint_id, the concrete model and expected {tokens_per_second, ttft_seconds}.
        These are a snapshot of the selected pair''s calibration at reservation time;
        unavailable metrics are null. The header is exposed through CORS. Upstream
        status, Content-Type and Retry-After are preserved; non-streaming/error bodies
        remain unchanged. Only the selected endpoint''s configured key is sent upstream;
        caller credentials/cookies and redirects are not forwarded. HTTPS certificates
        are verified. The server OpenAI key is used only by cloud audio, not this
        proxy. No model provisioning or automatic chat retries. Discovery defaults
        to a 3-second deadline per endpoint and a 1 MiB inventory limit; chat uses
        a 120-second upstream operation/idle timeout and an 8 MiB upstream body limit.
        The browser allows an extra 8 KiB for annotation/framing overhead. Failures
        after response headers terminate the stream and are recorded as failed; no
        proxy-generated error or [DONE] frame is appended. Upstream cleanup always
        releases the reservation. The Chat UI displays the stream''s selected model,
        host, group and original request size; expected speed remains in X-Compute-Target
        and actual speed uses unchanged upstream usage. Frontend rendering and explicit
        calibration parse their own streams separately. Readiness does not imply an
        available model. Malformed JSON/body types use native 422 problems.'
      operationId: compute__chat_0
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
                type: object
              - type: 'null'
              properties:
                messages:
                  items:
                    type: object
                  type: array
                model:
                  type: string
                  enum:
                  - smart
                  - small
                temperature:
                  type: number
                max_tokens:
                  type: integer
                stream:
                  type: boolean
                  default: false
                stream_options:
                  properties:
                    include_usage:
                      type: boolean
                      description: Request final upstream token usage; provider support
                        is required.
                  type: object
                reasoning_effort:
                  type: string
                  description: Passed through. The local chat uses medium for Thinking
                    on and none for off; supported values depend on the provider/model.
                reasoning:
                  properties:
                    enabled:
                      type: boolean
                  type: object
                  description: Passed-through provider reasoning options. The local
                    chat sets enabled to the Thinking toggle.
                chat_template_kwargs:
                  properties:
                    enable_thinking:
                      type: boolean
                  type: object
                  description: Passed-through local-server template options. The local
                    chat sets enable_thinking to the Thinking toggle.
              type: object
              required:
              - messages
              - model
              title: Data
            example:
              model: small
              messages:
              - role: user
                content: Hello
        required: false
      responses:
        '200':
          description: Upstream JSON or SSE with first/terminal routing metadata
          headers:
            X-Compute-Target:
              description: ASCII JSON, e.g. {"endpoint_id":"ep-0123456789abcdef","model":"fast-model","expected":{"tokens_per_second":42.5,"ttft_seconds":0.2}}.
                Exact selected-pair calibration copied before upstream I/O; missing
                metrics are null. Also present on other forwarded upstream statuses,
                absent on proxy-generated errors. Contains no credentials or endpoint
                URL.
              schema:
                type: string
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema: {}
            text/event-stream:
              schema:
                type: string
              example: 'data: {"choices":[{"delta":{"role":"assistant"},"finish_reason":null}],"modelname":"fast-model","compute_group":"small","compute_hostname":"llm.example","request_bytes":123}


                data: {"choices":[{"delta":{},"finish_reason":"stop"}],"modelname":"fast-model","compute_group":"small","compute_hostname":"llm.example","request_bytes":123}


                data: [DONE]


                '
        '404':
          description: Resource not found
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '405':
          description: Method Not Allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '500':
          description: Service failure
          content:
            application/json:
              schema:
                type: object
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '400':
          description: Missing/invalid model alias, messages or stream flag.
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      message:
                        type: string
                      type:
                        type: string
                      param:
                        type:
                        - string
                        - 'null'
                      code:
                        type: string
                    type: object
                    required:
                    - message
