        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
  /api/v1/compute/data/search:
    post:
      tags:
      - Services
      summary: Search a JSONL file
      description: Search a JSONL file. Case-insensitive all-word matching on text_t;
        returns matching JSON objects in file order, limited by max_rerank when supplied.
      operationId: compute__search_0
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
                type: object
              - type: 'null'
              properties:
                file:
                  type: string
                query:
                  type: string
                max_rerank:
                  type: integer
              type: object
              required:
              - file
              - query
              title: Search Data
            example:
              file: documents.jsonl
              query: hello
              max_rerank: 5
        required: false
      responses:
        '200':
          description: Service response
          content:
            application/json:
              schema: {}
          headers:
