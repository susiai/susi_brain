  /api/v1/compute/inference/chat:
    post:
      tags:
      - Existing services
      summary: Run the original chat service
      description: Run the original chat service. Forwards messages to OpenAI with
        the fixed model gpt-3.5-turbo, temperature 1.0 and max_tokens 50; other request
        options are ignored. Uses the configured OpenAI key. Missing data, messages
        or key return an error dictionary with HTTP 200. The provider JSON is returned
        unchanged, including provider errors, with HTTP 200.
      operationId: compute__chat_0
      requestBody:
        content:
          application/json:
            schema:
              properties:
                messages:
                  items:
                    type: object
                  type: array
              type: object
              required:
              - messages
            example:
              messages:
              - role: user
                content: Hello
        required: true
      responses:
        '200':
          description: Original service response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
