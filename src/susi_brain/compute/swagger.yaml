        of individual capabilities.
      operationId: compute__status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Compute  Status
              example:
                service: compute
                stage: migration-step-1
                ready: true
                authentication: disabled
                protocol_version: '1'
                implemented:
                - health
                - status
                - capabilities
                - offline-docs
                - chat
                - audio-transcription
                - speech
                - file-storage
                - search
                - system-metrics
                - provider-selection
                - endpoint-calibration
                - web-interface
                - request-monitoring
                pending:
                - resident-model-lifecycle
                - decision-interface
                - resource-admission-control
                - embedding
