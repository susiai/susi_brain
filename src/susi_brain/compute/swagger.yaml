  /api/v1/compute/status:
    get:
      summary: Status
      description: Report service, stage, ready, authentication, protocol_version,
        implemented/pending features and dependencies. Each dependency has name, required
        and ready fields. Lifecycle readiness describes application resources independently
        of individual capabilities.
      operationId: compute__status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Compute  Status
              example:
                service: compute
                stage: migration-step-1
                ready: true
                authentication: disabled
                protocol_version: '1'
                implemented:
                - health
                - status
                - capabilities
                - offline-docs
                - chat
                - audio-transcription
                - file-storage
                - search
                - system-metrics
                pending:
                - resident-model-lifecycle
                - provider-selection
                - decision-interface
                - resource-admission-control
                - embedding
                - speech
                dependencies: []
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '404':
          description: Not Found
          content:
            application/problem+json:
