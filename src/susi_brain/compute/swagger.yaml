  /api/v1/compute/audio/transcriptions:
    post:
      tags:
      - Services
      summary: Transcribe an audio file
      description: Transcribe an audio file. The Authorization header overrides the
        configured OpenAI key. With a key, whisper-1 forwards to OpenAI; other supported
        names select local Whisper or Vosk models. Without a key every requested model
        becomes tiny. Whisper loads on each request. Vosk requires mono PCM16 WAV
        and an en-us model directory in the working directory. Missing files return
        an error dictionary with HTTP 200; unsupported model names return an empty
        dictionary. Vosk result processing can fail with HTTP 500.
      operationId: compute__transcription_0
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_compute__transcription_0'
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  description: tiny, base, small, medium, large, whisper-1, en-us
                    or de; other names return an empty dictionary when a key is set.
                  default: tiny
              type: object
              required:
              - file
        required: false
      responses:
        '200':
          description: Service response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '404':
