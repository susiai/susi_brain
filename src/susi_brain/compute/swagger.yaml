  /api/v1/compute/inference/transcriptions:
    post:
      tags:
      - Existing services
      summary: Run the original audio service
      description: Run the original audio service. The Authorization header overrides
        the configured OpenAI key. With a key, whisper-1 forwards to OpenAI; other
        names use the existing local branches. Without a key every requested model
        becomes tiny. Whisper loads on each request. Vosk requires mono PCM16 WAV
        and the existing en-us model directory. Missing files return an error dictionary
        with HTTP 200; unsupported model names return an empty dictionary. The original
        Vosk JSON handling is unchanged and can raise a server error.
      operationId: compute__transcription_0
      responses:
        '200':
          description: Original service response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              description: The accepted or generated request correlation ID.
              schema:
