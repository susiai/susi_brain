    post:
      summary: Start
      description: Explicitly start one background calibration. Default scope is the
        union of configured smart/small/speech models on every selected endpoint;
        all probes advertised models instead. Speech configuration recognizes Ollama's
        omitted :latest tag. In all scope, /api/show detects additional speech models;
        non-speech models and servers without Ollama metadata retain chat probes.
        Optional concrete model and configured endpoint-ID filters bound the run.
        Configured filters must name smart/small/speech entries. Speech availability
        checks metadata/voice, then one fixed short WAV synthesis demonstrates speech;
        only a successful functional audio probe permits the separate longer speed
        sample. Chat availability/forms/vision/thinking probes retain their existing
        behavior. ALL model function tests finish before ANY speed sample. Chat speed
        uses 256 output tokens; audio probes use at most 1 MiB and a 60-second default
        per-check deadline, including metadata. Each check shares the same connection
        counters as Chat/TTS and releases on cancellation/failure; inventories and
        ordinary metadata discovery do not reserve. No arbitrary URL/prompt, automatic
        startup run, retries, model download or persistence. Starting replaces previous
        results. Authenticated HTTP pool, TLS and bounded discovery are shared with
        chat. calibration_max_pairs defaults to 1024; excess discovery fails before
        inference. Calls can incur configured provider charges. Concurrent run 409;
        inactive transport 503; invalid filters/empty selection 422. 202 is admission
        only; poll checks for results.
