  /api/v1/compute/ui:
    get:
      tags:
      - Interface
      summary: Interface
      description: Local Amber WebTUI interface using version-pinned WebTUI 0.1.10
        and IBM Plex Mono 2.5.0 served locally for single-prompt chat, speech to text,
        text to speech, model measurements, live connections, request monitoring and
        read-only configuration. Speech (#speech) accepts one dropped/chosen audio
        file up to 25 MiB or a microphone recording up to 3 minutes. Files upload
        immediately; microphone stop (also automatic at 3 minutes) submits the completed
        recording to POST /v1/audio/transcriptions as multipart file with model=tiny.
        Speech is transcribed in its original language; this is not live partial transcription.
        Recording uses a supported browser MIME/container, requires HTTPS or localhost
        and explicit microphone permission; page loading never requests access. Cancelling/navigation
        discards captured audio and stops tracks, including late permission grants;
        aborting an upload cannot stop already-running server inference. Audio/transcripts
        have no browser persistence. Horizontal top navigation groups Monitoring (Requests,
        Connections, Models), Services (Chat, Speech to text, Text to speech), Configuration
        (Startup configuration), and Documentation (Swagger UI, OpenAPI specification),
        without item numbers. Native disclosure menus support keyboard activation,
        Escape, and outside-click dismissal. The left context column shows service
        options, model/request filters or constraints; below 720px it becomes a collapsible
        section above the workspace. Ctrl/Command+Enter submits the active form, including
        from its sidebar options. Chat (#chat) has left-sidebar model smart/small
        (default small) and Thinking off/on (default off) controls; each explicit
        send streams POST /v1/chat/completions with only the current user message
        and requests usage. Thinking forwards reasoning_effort medium/none, reasoning.enabled
        and chat_template_kwargs.enable_thinking; actual support depends on the provider/model.
        No conversation history or browser persistence. Completion always displays
        expected selected-pair calibration and browser-measured throughput/TTFT; missing
        measurements/usage remain unavailable. Browser throughput uses upstream completion_tokens
        divided by request-to-stream-end elapsed time, including discovery/network
        and reasoning tokens; aborted/failed/truncated streams do not publish a successful
        rate. Navigating away stops the stream and discards the prompt/reply. Monitoring
        shows active API requests, a searchable completion log and UTC minute/ten-minute/hour/day
        histograms. Daily JSONL archives and reconstructed histograms survive restarts;
        text, exact and UTC time filters cover disk and buffered rows, and flush health
        is visible. Same-origin snapshots poll every five seconds while visible. Loading
        never starts inference or calibration. Text to speech (#tts) offers configured
        model/voice selectors in the left context column and a text box in the workspace,
        explicitly calls the WAV speech proxy, then enables playback/download and
        expected/browser first-audio/real-time-factor measurements after completion.
        It buffers at most 32 MiB, normalizes completed WAV sizes in a temporary Blob,
        and revokes the URL on navigation; no autoplay or persistent storage. Explicit
        calibration controls default to configured smart/small/speech models. Swagger
        is linked; all assets are local and root_path is honored.
      operationId: compute__web_ui
      responses:
        '200':
          description: Successful Response
